# Generated by lodi from one machine's own package database. It says what that machine
# had installed and chose. It says nothing about who runs it or where it lives.
#
# distribution: arch
#
# This is a starting point, not a backup. It does not carry anything installed from
# third-party repositories, foreign and hand-built packages, snaps and flatpaks, data,
# services, users, or package versions: an apply installs whatever the enabled
# repositories offer on the day it runs. A third-party apt repository this machine
# installed from is written as a commented [sources] block, to take on purpose. A
# changed configuration file is captured only when lodi's scan finds no credential
# marker in it; the scan finds the shapes it knows and proves nothing more, so read
# files/ before it leaves this machine.
# The NOT CAPTURED block at the end names what this machine had that is missing from
# the declarations above it.

[host]
version = "1"
distro = "arch"
# packages = "exact": an apply makes this machine's packages what this file declares, plus
# the distribution's own base system. A package whose line you delete is removed by the next
# apply, and one a declared package still needs is kept as a dependency; each is named in the
# plan with the reason. A package installed by hand since lodi last recorded this machine is
# not removed unless the apply is given --overwrite-drift. "managed" removes only what lodi
# recorded installing.
packages = "exact"
min_lodi_version = ">=1.1.1"
# The instant this machine was read, floored to the hour, UTC. It records when the
# reading was taken; no command of this build pins a package to it yet, and removing
# this line changes nothing about how this file applies today.
snapshot = "2026-09-22T01:00:00Z"

[packages]
# Every name here was installed and explicitly wanted on the machine that was read,
# with that distribution's own base system subtracted from it.
common = [
  "base",
  "linux",
  "linux-firmware",
]

# No hold was read off this machine. This distribution keeps no hold of its own:
# lodi expresses a hold as an option on its own transactions, so there is
# nothing on the machine to read back.
# hold = ["NAME"]

# Lines lodi did not write, and what each one would do if you did:
#
#   mark_auto = ["NAME"]  an apply marks NAME automatically installed, so that
#                         removing whatever pulled it in removes NAME with it.
#   optional  = ["NAME"]  an apply that finds no such package in the index leaves
#                         NAME out and carries on, rather than stopping.
#   absent    = ["NAME"]  an apply removes NAME wherever it finds it installed.
#
# packages = "exact" under [host] is why a line taken out of this list is a package
# taken off the machine: the next apply removes it, and says so.

# NOT CAPTURED
#
# 0 package(s) installed and chosen on this machine are NOT declared above,
# because an apply of this file on a fresh arch machine could not install them:
#   0 from a repository that is not arch's own
#   0 installed from a package file, or from a source this machine no longer has
#   0 from no repository this package manager knows
# 0 snap(s) and 0 system flatpak(s) are installed; the host scope manages neither.
#
# From a repository that is not arch's own: none
# Installed from a package file, or from a source this machine no longer has: none
# From no repository this package manager knows: none
#
# third-party pacman repositories: not read; lodi arms no pacman repository
