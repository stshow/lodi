# Generated by lodi from one machine's own package database. It says what that machine
# had installed and chose, and its settings. It says nothing about who runs it.
#
# distribution: ubuntu (noble)
#
# This is a starting point, not a backup. It does not carry anything installed from
# third-party repositories, foreign and hand-built packages, snaps and flatpaks, data,
# services, users, or package versions: a switch installs a missing package at what
# the dated archive at the snapshot below offers. A third-party apt repository this machine
# installed from is written as a commented [sources] block, to take on purpose. No
# file is copied from /etc: a changed configuration file is named at the end, with the
# [etc."PATH"] table that declares the text you want there instead.
# The NOT CAPTURED block at the end names what this machine had that is missing from
# the declarations above it.

[host]
version = "1"
distro = "ubuntu"
# packages = "exact": a switch makes this machine's packages what this file declares, plus
# the distribution's own base system. A package whose line you delete is removed by the next
# switch, and one a declared package still needs is kept as a dependency; each is named in the
# preview with the reason. A package installed by hand since lodi last recorded this machine is
# not removed unless the switch is given --overwrite-drift. "managed" removes only what lodi
# recorded installing.
packages = "exact"
min_lodi_version = ">=2.0.0"
# A switch installs a missing package from the dated archive at this instant, UTC;
# remove the line and it installs from the live archive instead.
snapshot = "2026-09-21T00:00:00Z"

[packages]
# Every name here was installed and explicitly wanted on the machine that was read,
# with that distribution's own base system subtracted from it.
common = [
  "build-essential",
  "htop",
  "linux-generic",
  "nginx",
  "ubuntu-minimal",
  "ubuntu-server-minimal",
  "ubuntu-standard",
]

# The names this machine keeps at the version it already has.
hold = [
  "nginx",
]

# Lines lodi did not write, and what each one would do if you did:
#
#   mark_auto = ["NAME"]  a switch marks NAME automatically installed, so that
#                         removing whatever pulled it in removes NAME with it.
#   optional  = ["NAME"]  a switch that finds no such package in the index leaves
#                         NAME out and carries on, rather than stopping.
#   absent    = ["NAME"]  a switch removes NAME wherever it finds it installed.
#
# packages = "exact" under [host] is why a line taken out of this list is a package
# taken off the machine: the next switch removes it, and says so.

# The apt repositories beyond the default ones this machine installed from, each written as the
# [sources] block a switch would turn on. They are commented out, because turning one on
# writes a trust anchor, and that is a step you take on purpose: remove the `# ` from
# a block's lines to take it, then add the names it lists to [packages]. The keyring
# it names travels beside this file under files/, and a switch verifies it against
# signed_by_sha256 before it writes anything.
#
# [sources.backports]
# # read from /etc/apt/sources.list.d/ubuntu.sources
# # noble-backports of the distribution's own archive, signed by its own key; on this
# # machine that file already lists it: take the suite out of it before you
# # take this block here, because apt refuses two Signed-By values for one suite
# # nothing installed on this machine came from it
# # a lodi that reads [sources]; when you take this block, [host] needs
# #   min_lodi_version = ">=1.3.0"
# # the keyring was not written (--stdout): copy /usr/share/keyrings/ubuntu-archive-keyring.gpg
# # to files/etc/apt/keyrings/lodi-backports.gpg beside this file
# types = ["deb"]
# uris = ["https://archive.ubuntu.com/ubuntu/"]
# suites = ["${host.codename}-backports"]
# components = ["main", "universe", "restricted", "multiverse"]
# signed_by = "files/etc/apt/keyrings/lodi-backports.gpg"
# signed_by_sha256 = "cbec27bcada29392763883629ff39723dfd89741e2c0abb2b11a2f2cc5cab441"

# [sources.proposed]
# # read from /etc/apt/sources.list.d/ubuntu-proposed.list
# # noble-proposed of the distribution's own archive, signed by its own key; on this
# # machine that file already lists it: take the suite out of it before you
# # take this block here, because apt refuses two Signed-By values for one suite
# # nothing installed on this machine came from it
# # a lodi that reads [sources]; when you take this block, [host] needs
# #   min_lodi_version = ">=1.3.0"
# # the keyring was not written (--stdout): copy /usr/share/keyrings/ubuntu-archive-keyring.gpg
# # to files/etc/apt/keyrings/lodi-proposed.gpg beside this file
# types = ["deb", "deb-src"]
# uris = ["https://archive.ubuntu.com/ubuntu"]
# suites = ["${host.codename}-proposed"]
# components = ["main", "universe"]
# signed_by = "files/etc/apt/keyrings/lodi-proposed.gpg"
# signed_by_sha256 = "cbec27bcada29392763883629ff39723dfd89741e2c0abb2b11a2f2cc5cab441"

# The machine's own settings. A switch sets each one that differs, and leaves a
# line you take out as it is.
[system]
hostname = "a-machine-that-was-read"

# Tables lodi does not read off a machine, to write on purpose:
# [services]
# "ssh.service" = "enabled"     # enabled and started; "disabled" stops it
# [firewall]
# allow = ["22/tcp"]             # lodi's own nftables table; the rest is dropped
# [network]
# interfaces.eth0 = { dhcp = true }  # put back if the machine is cut off
# [etc."motd"]
# text = "..."                   # a file under /etc holding exactly this text

# NOT CAPTURED
#
# 1 package(s) installed and chosen on this machine are NOT declared above,
# because a switch of this file on a fresh ubuntu machine could not install them:
#   0 from a repository that is not ubuntu's own
#   1 installed from a package file, or from a source this machine no longer has
#   0 from no repository this package manager knows
# 2 snap(s) and 0 system flatpak(s) are installed; the host scope manages neither.
#
# From a repository that is not ubuntu's own: none
# Installed from a package file, or from a source this machine no longer has:
#   ubuntu-hand-built
# From no repository this package manager knows: none
#
# repositories read and not written as a [sources] block: none
# the distribution's own repositories, which every install has: 2
# installed packages attributed to no [sources] block:
#   ubuntu-hand-built
#     unattributed: no enabled repository offers the installed version (a package file, or a repository since removed)
