# Generated by lodi from one machine's own package database. It says what that machine
# had installed and chose, and its settings. It says nothing about who runs it.
#
# distribution: arch
#
# This is a starting point, not a backup. It does not carry anything installed from
# third-party repositories, foreign and hand-built packages, snaps and flatpaks, data,
# services, users, or package versions: a switch installs a missing package at what
# the dated archive at the snapshot below offers. A third-party apt repository this machine
# installed from is written as a commented [sources] block, to take on purpose. No
# file is copied from /etc: a changed configuration file is named at the end, with the
# [etc."PATH"] table that declares the text you want there instead.
# The NOT CAPTURED block at the end names what this machine had that is missing from
# the declarations above it.

[host]
version = "1"
distro = "arch"
# packages = "exact": a switch makes this machine's packages what this file declares, plus
# the distribution's own base system. A package whose line you delete is removed by the next
# switch, and one a declared package still needs is kept as a dependency; each is named in the
# preview with the reason. A package installed by hand since lodi last recorded this machine is
# not removed unless the switch is given --overwrite-drift. "managed" removes only what lodi
# recorded installing.
packages = "exact"
min_lodi_version = ">=2.0.0"
# A switch installs a missing package from the dated archive at this instant, UTC;
# remove the line and it installs from the live archive instead.
snapshot = "2026-09-21T00:00:00Z"

[packages]
# Every name here was installed and explicitly wanted on the machine that was read,
# with that distribution's own base system subtracted from it.
common = [
  "base",
  "linux",
  "lodi-tool",
  "ripgrep",
]

# No hold was read off this machine. This distribution keeps no hold of its own:
# lodi expresses a hold as an option on its own transactions, so there is
# nothing on the machine to read back.
# hold = ["NAME"]

# Lines lodi did not write, and what each one would do if you did:
#
#   mark_auto = ["NAME"]  a switch marks NAME automatically installed, so that
#                         removing whatever pulled it in removes NAME with it.
#   optional  = ["NAME"]  a switch that finds no such package in the index leaves
#                         NAME out and carries on, rather than stopping.
#   absent    = ["NAME"]  a switch removes NAME wherever it finds it installed.
#
# packages = "exact" under [host] is why a line taken out of this list is a package
# taken off the machine: the next switch removes it, and says so.

# The machine's own settings. A switch sets each one that differs, and leaves a
# line you take out as it is.
[system]
hostname = "a-machine-that-was-read"

# Tables lodi does not read off a machine, to write on purpose:
# [services]
# "ssh.service" = "enabled"     # enabled and started; "disabled" stops it
# [firewall]
# allow = ["22/tcp"]             # lodi's own nftables table; the rest is dropped
# [network]
# interfaces.eth0 = { dhcp = true }  # put back if the machine is cut off
# [etc."motd"]
# text = "..."                   # a file under /etc holding exactly this text

# NOT CAPTURED
#
# 2 package(s) installed and chosen on this machine are NOT declared above,
# because a switch of this file on a fresh arch machine could not install them:
#   1 from a repository that is not arch's own
#   0 installed from a package file, or from a source this machine no longer has
#   1 from no repository this package manager knows
# 0 snap(s) and 0 system flatpak(s) are installed; the host scope manages neither.
#
# From a repository that is not arch's own — add that source on the new machine
# first, or a switch of this file stops at E_UNKNOWN_PACKAGE before it installs
# anything:
#   tela-icon-theme         chaotic-aur
# Installed from a package file, or from a source this machine no longer has: none
# From no repository this package manager knows:
#   yay
#
# third-party pacman repositories: not read; lodi arms no pacman repository
