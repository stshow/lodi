# Generated by lodi from one machine's own package database. It says what that machine
# had installed and chose, and its settings. It says nothing about who runs it.
#
# distribution: debian (bookworm)
#
# This is a starting point, not a backup. It does not carry anything installed from
# third-party repositories, foreign and hand-built packages, snaps and flatpaks, data,
# services, users, or package versions: an apply installs a missing package at what
# the dated archive at the snapshot below offers. A third-party apt repository this machine
# installed from is written as a commented [sources] block, to take on purpose. No
# file is copied from /etc: a changed configuration file is named at the end, with the
# [etc."PATH"] table that declares the text you want there instead.
# The NOT CAPTURED block at the end names what this machine had that is missing from
# the declarations above it.

[host]
version = "1"
distro = "debian"
# packages = "exact": an apply makes this machine's packages what this file declares, plus
# the distribution's own base system. A package whose line you delete is removed by the next
# apply, and one a declared package still needs is kept as a dependency; each is named in the
# plan with the reason. A package installed by hand since lodi last recorded this machine is
# not removed unless the apply is given --overwrite-drift. "managed" removes only what lodi
# recorded installing.
packages = "exact"
min_lodi_version = ">=1.4.0"
# An apply installs a missing package from the dated archive at this instant, UTC;
# remove the line and it installs from the live archive instead.
snapshot = "2026-09-21T00:00:00Z"

[packages]
# Every name here was installed and explicitly wanted on the machine that was read,
# with that distribution's own base system subtracted from it.
common = [
  "curl",
  "git",
  "linux-image-amd64",
  "ripgrep",
  "sqlite3",
  "task-english",
  "task-ssh-server",
]

# The names this machine keeps at the version it already has.
hold = [
  "ripgrep",
]

# Lines lodi did not write, and what each one would do if you did:
#
#   mark_auto = ["NAME"]  an apply marks NAME automatically installed, so that
#                         removing whatever pulled it in removes NAME with it.
#   optional  = ["NAME"]  an apply that finds no such package in the index leaves
#                         NAME out and carries on, rather than stopping.
#   absent    = ["NAME"]  an apply removes NAME wherever it finds it installed.
#
# packages = "exact" under [host] is why a line taken out of this list is a package
# taken off the machine: the next apply removes it, and says so.

# The apt repositories beyond the default ones this machine installed from, each written as the
# [sources] block an apply would arm. They are commented out, because arming one
# writes a trust anchor, and that is a step you take on purpose: remove the `# ` from
# a block's lines to take it, then add the names it lists to [packages]. The keyring
# it names travels beside this file under files/, and an apply verifies it against
# signed_by_sha256 before it writes anything.
#
# [sources.docker]
# # read from /etc/apt/sources.list.d/docker.sources
# # on this machine that file already lists it: disable that stanza before you
# # take this block here, because apt refuses two Signed-By values for one repository
# # installed from it, and not declared under [packages] until you take it:
# #   docker-ce
# #   docker-ce-cli
# # a lodi that reads [sources]; when you take this block, [host] needs
# #   min_lodi_version = ">=1.3.0"
# # the keyring was not written (--stdout): copy /etc/apt/keyrings/docker.asc
# # to files/etc/apt/keyrings/lodi-docker.asc beside this file
# types = ["deb"]
# uris = ["https://download.docker.com/linux/debian"]
# suites = ["${host.codename}"]
# components = ["stable"]
# architectures = ["amd64"]
# signed_by = "files/etc/apt/keyrings/lodi-docker.asc"
# signed_by_sha256 = "40bcffe92a7a05c684c787348036c5e96a4183a85204b07dfba5f4f715ae9f63"

# The machine's own settings. An apply sets each one that differs, and leaves a
# line you take out as it is.
[system]
hostname = "a-machine-that-was-read"

# Tables lodi does not read off a machine, to write on purpose:
# [services]
# "ssh.service" = true          # enabled and started; false disables and stops it
# [firewall]
# allow = ["22/tcp"]             # lodi's own nftables table; the rest is dropped
# [network]
# interfaces.eth0 = { dhcp = true }  # put back if the machine is cut off
# [etc."motd"]
# text = "..."                   # a file under /etc holding exactly this text

# NOT CAPTURED
#
# 3 package(s) installed and chosen on this machine are NOT declared above,
# because an apply of this file on a fresh debian machine could not install them:
#   2 from a repository that is not debian's own
#   1 installed from a package file, or from a source this machine no longer has
#   0 from no repository this package manager knows
# 0 snap(s) and 0 system flatpak(s) are installed; the host scope manages neither.
#
# From a repository that is not debian's own — take its commented [sources] block
# above, where one is written (the repositories below say why not), and add the name
# to [packages]; without the source an apply of this file stops at
# E_UNKNOWN_PACKAGE before it installs anything:
#   docker-ce               Docker, bookworm/stable
#   docker-ce-cli           Docker, bookworm/stable
# Installed from a package file, or from a source this machine no longer has:
#   lodi-hand-built
# From no repository this package manager knows: none
#
# repositories read and not written as a [sources] block: none
# the distribution's own repositories, which every install has: 3
# installed packages attributed to no [sources] block:
#   lodi-hand-built
#     unattributed: no enabled repository offers the installed version (a package file, or a repository since removed)
