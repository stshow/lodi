# Managed by lodi from home.toml [programs.tmuxish]. Edit home.toml, not this file:
# a hand edit here is drift, and `lodi switch` stops on it.

set -g mouse on
set -g history-limit 50000
set -g status-left '#S $HOME ~'
set -g status-right "it's \"\$USER\" at \~ \\ %H:%M"
bind r source-file ~/.config/tmuxish/tmux.conf
