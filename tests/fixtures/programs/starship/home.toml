[home]
version = "1"

[programs.starship]
format = "$directory$git_branch$character"
add_newline = false
command_timeout = 500
scan_timeout = 30
character.success_symbol = "[>](bold green)"
character.error_symbol = "[>](bold red)"
shells = ["zsh", "bash"]
extra = '''
[git_branch]
symbol = "git "
'''
