[home]
version = "1"

[programs.bash]
extra = """
bind '"\\e[A": history-search-backward'
"""
snippets = ["snippets/prompt.sh", "snippets/nonl.sh"]
shopt = ["histappend", "globstar"]
histcontrol = ["ignorespace", "erasedups"]
histfilesize = 20000
histsize = 10000
path = ["~/.local/bin", "~/go/bin", "/opt/example/bin"]

[programs.bash.aliases]
la = "ls -la"
ll = "ls -l"
gs = "git status"

[programs.bash.env]
QUOTED = "it's $literal"
GOPATH = "~/go"
PAGER = "less"
EDITOR = "nvim"

[tools]
jq = "latest"
