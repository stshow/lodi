# Generated by `lodi home import` from one home directory's own files. It names no
# user, no machine and no path outside that home directory, and it carries no date and
# no lodi version, so two imports of an unchanged home directory are the same bytes.
#
# 6 files captured out of the 6 this build looks for.
#
# Each entry's bytes are the file beside this manifest under `files/`. With no flag
# `lodi home import` writes both where `lodi home plan` reads them; a bundle written
# with `--out DIR` is copied there whole first. Then read the plan:
#
#     lodi home plan     then     lodi home apply
#
# This is a starting point, not a backup. It carries the hand-edited dotfiles on
# lodi's own allowlist and nothing else: no data, no history, no keys, no credentials,
# and no file whose mode says it is private. The NOT CAPTURED block at the end names
# every path that was looked at and left out, with the reason.

[home]
version = "1"

[files.".config/git/ignore"]
source = "files/.config/git/ignore"
mode = "0644"

[files.".config/nvim/init.vim"]
source = "files/.config/nvim/init.vim"
mode = "0644"

[files.".config/starship.toml"]
source = "files/.config/starship.toml"
mode = "0644"

[files.".editorconfig"]
source = "files/.editorconfig"
mode = "0644"

[files.".inputrc"]
source = "files/.inputrc"
mode = "0644"

[files.".tmux.conf"]
source = "files/.tmux.conf"
mode = "0644"

# [tools] — lodi can put pinned upstream tools on your PATH. Each name below is in
# lodi's catalogue and an executable of the same name is on your PATH right now, so
# you may already want lodi to own it. This block is commented out on purpose: an
# apply would take over those names, and "latest" for a tool you did not ask lodi to
# manage is not a choice this command makes for you. Uncomment what you want.
# [tools]
# jq = "latest"
# ripgrep = "latest"

# NOT CAPTURED
#
# Nothing is ever redacted: a path that trips a gate is refused whole and named here.
# Adding one to this manifest yourself is a deliberate act lodi does not take for you.
#
#   .aws/: it holds cloud credentials
#   .config/chromium/: it is a browser profile
#   .config/google-chrome/: it is a browser profile
#   .docker/config.json: it holds registry credentials
#   .git-credentials: it holds credentials in clear text
#   .gitconfig: it carries an e-mail address by construction
#   .gnupg/: it holds private keys
#   .local/share/keyrings/: it holds a stored-password keyring
#   .mozilla/: it is a browser profile
#   .netrc: it holds credentials in clear text
#   .npmrc: it can hold a registry token
#   .pypirc: it can hold a registry token
#   .ssh/: it holds private keys
#
# every path this build looks for was there.
#
# lodi never opens, reads or writes a shell configuration file — not a login profile, not an
# rc file, whatever shell it belongs to — so none of them is on the allowlist above and none
# was read here. Put what you want lodi to own in a file of your own and source it; the one
# line that activates lodi's own tools is printed by `lodi home apply` for you to add.
