# Generated by `lodi home import`. It copied nothing and read no file in your home
# directory: every table below is commented out and holds no value from this machine,
# so no setting, secret or address of yours is in it. It names no user, no machine and
# no path outside the home directory, and it carries no date and no lodi version.
#
# Uncomment what you want, fill in your own values, then read the plan:
#
#     lodi home plan     then     lodi home apply
#
# With no flag `lodi home import` writes this file where `lodi home plan` reads it; one
# written with `--out DIR` or `--stdout` is copied there first.

[home]
version = "1"

# [programs] — lodi renders a program's own configuration file from a table of its keys.
# Each stub below is a program lodi has a module for whose executable is on your PATH
# right now; the values are examples, not yours. Declaring a table installs nothing,
# and `enable`, `backup`, `on_remove` and `extra` work in every one.

# [programs.bash]
# env = { EDITOR = "vi" }
# path = ["~/.local/bin"]
# aliases = { ll = "ls -l" }
# histsize = 10000
# histfilesize = 20000
# histcontrol = ["ignoredups"]
# shopt = ["histappend"]
# snippets = []

# [programs.fish]
# env = { EDITOR = "vi" }
# path = ["~/.local/bin"]
# aliases = { ll = "ls -l" }
# abbrs = { gs = "git status" }
# greeting = ""
# snippets = []

# [programs.git]
# user.name = ""
# user.email = ""  # your address; lodi never imports it
# init.defaultBranch = "main"
# core.editor = "vi"
# core.pager = "less"
# pull.rebase = true
# push.autoSetupRemote = true
# merge.conflictStyle = "zdiff3"
# alias = { st = "status" }
# ignores = ["*.swp"]

# [programs.helix]
# theme = "default"
# editor.line-number = "relative"
# editor.auto-format = true
# editor.cursorline = true
# editor.mouse = true
# editor.true-color = true
# editor.rulers = [100]
# editor.cursor-shape.insert = "bar"
# editor.cursor-shape.normal = "block"
# editor.cursor-shape.select = "underline"

# [programs.tmux]
# prefix = "C-a"
# mouse = true
# status = true
# base-index = 1
# escape-time = 10
# history-limit = 10000
# default-terminal = "tmux-256color"
# mode-keys = "vi"

# [tools] — lodi can put pinned upstream tools on your PATH. Each name below is in
# lodi's catalogue and an executable of the same name is on your PATH right now, so
# you may already want lodi to own it. This block is commented out on purpose: an
# apply would take over those names, and "latest" for a tool you did not ask lodi to
# manage is not a choice this command makes for you. Uncomment what you want.
# A tool lodi has no recipe for takes one of your own: recipes/NAME.toml at your repository's root.
# [tools]
# jq = "latest"
# ripgrep = "latest"

# [home.file] — for a file no module covers, declare its bytes yourself: inline with
# `text`, or from a file beside this manifest with `source`. lodi writes the file and
# owns it from then on; a different file already at the path is backed up once first.
# [home.file.".editorconfig"]
# text = "root = true\n"
# [home.file.".inputrc"]
# source = "dotfiles/inputrc"

# WHAT THIS FILE DOES NOT CARRY
#
# Your settings. This import copied nothing and read no file's content, so nothing of
# yours is in this file. It only asked whether a file is there, never what it holds, at
# each path lodi's program modules write or that a program reads before them:
#
#   .config/alacritty/alacritty.toml exists; translate what you need into [programs.alacritty]
#   .config/fish/conf.d/lodi.fish exists; translate what you need into [programs.fish]
#   .config/git/config exists; translate what you need into [programs.git]
#   .config/git/ignore exists; translate what you need into [programs.git]
#   .gitconfig exists; translate what you need into [programs.git]
#   .config/helix/config.toml exists; translate what you need into [programs.helix]
#   .config/kitty/kitty.conf exists; translate what you need into [programs.kitty]
#   .config/nvim/init.lua exists; translate what you need into [programs.nvim]
#   .config/nvim/init.vim exists; translate what you need into [programs.nvim]
#   .config/starship.toml exists; translate what you need into [programs.starship]
#   .config/tmux/tmux.conf exists; translate what you need into [programs.tmux]
#   .tmux.conf exists; translate what you need into [programs.tmux]
#
# lodi never opens, reads or writes a shell configuration file — not a login profile, not an
# rc file, whatever shell it belongs to. [programs.bash] and [programs.zsh] render a file of
# lodi's own that you source with the one line `lodi home apply` prints; [programs.fish]
# renders a drop-in fish loads by itself.
