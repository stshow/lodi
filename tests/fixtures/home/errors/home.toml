# Every load error of M-0.5 T-2 in one file: the test proves they are all reported in one run,
# sorted by position, each with its code, its file:line:column and a hint.
[home]
version = "2"
min_lodi_version = "99.0.0"
registries = ["nowhere"]
frobnicate = 1

[vars]
a = "b"

[inputs]
a = "b"

[modules]
a = "b"

[tools]
python = "3.12"

[home.file."/etc/passwd"]
text = "absolute"

[home.file."../escape"]
text = "outside the home"

[home.file."~/tilde"]
text = "a tilde component"

[home.file.".both"]
text = "one"
source = "./dotfiles/inputrc"

[home.file.".neither"]
mode = "0644"

[home.file.".setuid"]
text = "x"
mode = "4755"

[home.file.".notoctal"]
text = "x"
mode = "rw-"

[home.file.".absent-with-content"]
state = "absent"
text = "x"

[home.file.".badstate"]
text = "x"
state = "perhaps"

[home.file.".missing-source"]
source = "./nope"

[home.file.".substitution"]
text = "${host.arch}"

[home.file.".malformed"]
text = "${not a name}"

[home.file.".unknown-key"]
text = "x"
onremove = "keep"

[home.file.".dup"]
text = "x"

[home.file.".dup/"]
text = "y"

[frobnicate]
a = "b"
