# A home manifest with several files, for the plan's lexicographic order and mode column.
[home]
version = "1"
min_lodi_version = ""

[home.file.".config/git/ignore"]
text = """
.lodi/
"""

[home.file.".gitconfig"]
text = "[core]\n\tautocrlf = input\n"

[home.file.".inputrc"]
source = "./dotfiles/inputrc"
mode = "0600"

[home.file.".netrc-that-must-go"]
state = "absent"
backup = true
on_remove = "keep"
