# manifest sha256:f1e66cdd6eff2c9ccad192f8865af9be6d69b46b3f13329d2975a2d61a1296c5); the
# repository is the release's own Everything tree. Neither changes after the release, and every
# build the image holds is in that repository at the same EVR (measured), so a lock resolves on
