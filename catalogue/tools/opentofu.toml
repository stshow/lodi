# opentofu for [tools] opentofu. This recipe says where to look; it lists no version. `lodi lock`
# discovers versions from the tags of the newest GitHub releases.
# The recipe is `opentofu` and the command `tofu`. Release candidates are pre-releases and
# are skipped.
[recipe]
name        = "opentofu"
description = "An open-source infrastructure-as-code tool"
homepage    = "https://opentofu.org"

[versions]
strategy = "github_releases"
repo     = "opentofu/opentofu"
asset    = "tofu_${version}_linux_${arch_alt}.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 0

[spec]
bin  = ["tofu"]
path = ["."]
