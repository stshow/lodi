# bat for [tools] bat. This recipe says where to look; it lists no version. `lodi lock`
# discovers versions from the tags of the newest GitHub releases.
[recipe]
name        = "bat"
description = "A cat clone with syntax highlighting and Git integration"
homepage    = "https://github.com/sharkdp/bat"

[versions]
strategy = "github_releases"
repo     = "sharkdp/bat"
asset    = "bat-${tag}-${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["bat"]
path = ["."]
