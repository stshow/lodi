# zoxide for [tools] zoxide. This recipe says where to look; it lists no version. `lodi update`
# discovers versions from the tags of the newest GitHub releases. The shell's init line stays the
# user's own. Older releases publish no API digest, so a constraint that selects one is refused
# rather than downloaded.
[recipe]
name        = "zoxide"
description = "A smarter cd command"
homepage    = "https://github.com/ajeetdsouza/zoxide"

[versions]
strategy = "github_releases"
repo     = "ajeetdsouza/zoxide"
asset    = "zoxide-${version}-${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 0

[spec]
bin  = ["zoxide"]
path = ["."]
