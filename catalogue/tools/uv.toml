# uv for [tools] uv. This recipe says where to look; it lists no version. The
# musl build is the relocatable one: it needs no loader from the host.
[recipe]
name        = "uv"
description = "An extremely fast Python package and project manager"
homepage    = "https://github.com/astral-sh/uv"

[versions]
strategy = "github_releases"
repo     = "astral-sh/uv"
tag      = "${version}"
asset    = "uv-${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["uv", "uvx"]
path = ["."]
