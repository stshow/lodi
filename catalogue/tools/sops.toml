# sops for [tools] sops. This recipe says where to look; it lists no version. `lodi update`
# discovers versions from the tags of the newest GitHub releases. Upstream publishes a bare
# executable whose name carries the tag; it is installed as `bin/sops`.
[recipe]
name        = "sops"
description = "Simple and flexible tool for managing secrets"
homepage    = "https://getsops.io"

[versions]
strategy = "github_releases"
repo     = "getsops/sops"
asset    = "sops-${tag}.linux.${arch_alt}"

[asset]
format = "binary"

[spec]
bin  = ["bin/sops"]
path = ["bin"]
