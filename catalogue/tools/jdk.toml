# The Eclipse Temurin JDK for [tools] jdk. This recipe says where to look; it
# lists no version and it names no feature-release line. `lodi lock` asks the Adoptium API for
# the line the constraint names -- `jdk = "21"` asks for 21 -- and `latest` is the newest
# long-term-support line the API itself publishes.
#
# Adoptium is the one upstream here that publishes the download URL and the artifact's SHA-256
# together, so this recipe declares neither `url` nor `checksum_file`: both come from the API.
[recipe]
name        = "jdk"
description = "Eclipse Temurin, the Adoptium build of OpenJDK"
homepage    = "https://adoptium.net"

[arch_names]
x86_64 = "x64"

[versions]
strategy   = "adoptium"
image_type = "jdk"
jvm_impl   = "hotspot"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["bin/java", "bin/javac"]
path = ["bin"]
env  = { JAVA_HOME = "${self.path}" }
