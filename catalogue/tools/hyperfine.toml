# hyperfine for [tools] hyperfine. This recipe says where to look; it lists no
# version.
[recipe]
name        = "hyperfine"
description = "A command-line benchmarking tool"
homepage    = "https://github.com/sharkdp/hyperfine"

[versions]
strategy = "github_releases"
repo     = "sharkdp/hyperfine"
asset    = "hyperfine-${tag}-${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["hyperfine"]
path = ["."]
