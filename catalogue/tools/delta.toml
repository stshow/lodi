# delta for [tools] delta. This recipe says where to look; it lists no version. `lodi lock`
# discovers versions from the tags of the newest GitHub releases.
# Named after the command, `delta`; upstream tags carry no `v` prefix.
[recipe]
name        = "delta"
description = "A syntax-highlighting pager for git, diff and grep output"
homepage    = "https://dandavison.github.io/delta"

[versions]
strategy = "github_releases"
repo     = "dandavison/delta"
tag      = "${version}"
asset    = "delta-${version}-${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["delta"]
path = ["."]
