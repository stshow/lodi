# helm for [tools] helm. This recipe says where to look; it lists no version. `lodi update` reads
# the one-line latest-version file upstream publishes, so only the current version is discoverable:
# `latest` resolves, a constraint on an older line finds none. Each archive has a `.sha256` file
# holding its bare digest beside it.
[recipe]
name        = "helm"
description = "The package manager for Kubernetes"
homepage    = "https://helm.sh"

[versions]
strategy = "text_index"
url      = "https://get.helm.sh/helm-latest-version"
line     = "v${version}"

[asset]
url              = "https://get.helm.sh/helm-v${version}-linux-${arch_alt}.tar.gz"
format           = "tar.gz"
strip_components = 1
checksum_sidecar = ".sha256"

[spec]
bin  = ["helm"]
path = ["."]
