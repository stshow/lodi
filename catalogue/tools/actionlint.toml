# actionlint for [tools] actionlint. This recipe says where to look; it lists no version. `lodi lock`
# discovers versions from the tags of the newest GitHub releases.
[recipe]
name        = "actionlint"
description = "A static checker for GitHub Actions workflow files"
homepage    = "https://rhysd.github.io/actionlint"

[versions]
strategy = "github_releases"
repo     = "rhysd/actionlint"
asset    = "actionlint_${version}_linux_${arch_alt}.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 0

[spec]
bin  = ["actionlint"]
path = ["."]
