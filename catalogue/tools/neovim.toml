# neovim for [tools] neovim. This recipe says where to look; it lists no version. `lodi update`
# discovers versions from the tags of the newest GitHub releases. The newest releases include a
# moving `stable` release and a `nightly` pre-release; neither tag matches the template, so five
# releases are read to leave three real ones. The program runs from its tree, with `lib/` and
# `share/` beside `bin/`.
[recipe]
name        = "neovim"
description = "Vim-fork focused on extensibility and usability"
homepage    = "https://neovim.io"

[versions]
strategy = "github_releases"
repo     = "neovim/neovim"
releases = 5
asset    = "nvim-linux-${arch}.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["bin/nvim"]
path = ["bin"]
