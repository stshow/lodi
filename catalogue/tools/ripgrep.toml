# ripgrep for [tools] ripgrep. This recipe says where to look; it lists no version. `lodi update`
# discovers versions from the tags of the newest GitHub releases.
[recipe]
name        = "ripgrep"
description = "Recursively search directories for a regex pattern, fast"
homepage    = "https://github.com/BurntSushi/ripgrep"

[versions]
strategy = "github_releases"
repo     = "BurntSushi/ripgrep"
tag      = "${version}"
asset    = "ripgrep-${version}-${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 1

[spec]
bin  = ["rg"]
path = ["."]
