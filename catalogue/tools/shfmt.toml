# shfmt for [tools] shfmt. This recipe says where to look; it lists no version. `lodi update`
# discovers versions from the tags of the newest GitHub releases. Named after the command, not the
# repository. Upstream publishes a bare executable whose name carries the tag; it is installed as
# `bin/shfmt`.
[recipe]
name        = "shfmt"
description = "A shell parser, formatter and interpreter"
homepage    = "https://github.com/mvdan/sh"

[versions]
strategy = "github_releases"
repo     = "mvdan/sh"
asset    = "shfmt_${tag}_linux_${arch_alt}"

[asset]
format = "binary"

[spec]
bin  = ["bin/shfmt"]
path = ["bin"]
