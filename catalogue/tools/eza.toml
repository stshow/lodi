# eza for [tools] eza. This recipe says where to look; it lists no version. `lodi update` discovers
# versions from the tags of the newest GitHub releases. The asset name carries no version, so the
# release tag alone is the version.
[recipe]
name        = "eza"
description = "A modern alternative to ls"
homepage    = "https://eza.rocks"

[versions]
strategy = "github_releases"
repo     = "eza-community/eza"
asset    = "eza_${arch}-unknown-linux-musl.tar.gz"

[asset]
format           = "tar.gz"
strip_components = 0

[spec]
bin  = ["eza"]
path = ["."]
